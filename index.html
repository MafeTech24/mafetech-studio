        {
          "@type": "Question",
          "name": "¿Qué es Workflow Automation y para qué sirve?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Workflow Automation es la automatización de flujos de trabajo mediante software. Permite que tareas como clasificar leads, procesar documentos, enviar emails o actualizar planillas ocurran de forma automática, sin intervención manual. MafeTech implementa estos workflows principalmente con n8n."
          }
        },
        {
          "@type": "Question",
          "name": "¿MafeTech trabaja con n8n?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. n8n es la herramienta principal de MafeTech para Workflow Automation. María Fernanda Moreno diseña e implementa pipelines con n8n para automatizar procesos de negocio, integrar APIs y conectar sistemas como Gmail, Google Sheets, WhatsApp, CRMs y modelos de IA como Gemini."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué tipo de automatizaciones con IA puede crear MafeTech?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "MafeTech crea automatizaciones con inteligencia artificial que incluyen: clasificación de leads con score automático, análisis de sentimientos, procesamiento de documentos (OCR + IA), chatbots conversacionales en WhatsApp, sistemas de triage con RAG y Human-in-the-Loop, y pipelines de Document Intelligence con Gemini AI."
          }
        },
        {
          "@type": "Question",
          "name": "¿MafeTech integra APIs y webhooks?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. MafeTech implementa integraciones entre sistemas mediante APIs REST y webhooks. Algunas integraciones frecuentes son: Gmail API, Google Sheets API, WhatsApp API, Supabase, Firebase, plataformas CRM y servicios SaaS. Todo mediante workflows en n8n o código Node.js."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué procesos puede automatizar una pyme con MafeTech?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "MafeTech puede automatizar: clasificación y seguimiento de leads, respuestas automáticas por WhatsApp o email, procesamiento de facturas y documentos, actualización de planillas de Google Sheets, notificaciones en tiempo real, generación de reportes, y cualquier flujo que hoy se haga manualmente con herramientas digitales."
          }
        },
        {
          "@type": "Question",
          "name": "¿MafeTech también desarrolla sitios web?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. MafeTech desarrolla aplicaciones web, sitios institucionales y e-commerce con React, TypeScript, Next.js y Vite. La diferencia clave es que estos sitios pueden conectarse a automatizaciones: formularios que disparan workflows, catálogos con inventario en tiempo real desde Supabase, y canales de WhatsApp integrados."
          }
        },
        {
          "@type": "Question",
          "name": "¿MafeTech trabaja con clientes de España o Latinoamérica?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. MafeTech tiene base en Córdoba Capital, Argentina, pero trabaja completamente de forma remota con clientes en toda Argentina, Latinoamérica (México, Chile, Colombia, Uruguay y más) y España. Los proyectos se coordinan por WhatsApp, videollamada y plataformas de gestión."
          }
        },

          "@type": "Question",
          "name": "¿Qué tecnologías usa MafeTech?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "MafeTech usa principalmente: n8n y Make para Workflow Automation; Gemini AI y GPT para AI Automation; React, TypeScript, Next.js y Vite para desarrollo web; Supabase, Firebase, MongoDB y PostgreSQL para bases de datos; y Vercel y GitHub para deployment y versionado."
          }
        },

          "@type": "Question",
          "name": "¿Cómo se inicia un proyecto de automatización con MafeTech?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El proceso empieza con un diagnóstico gratuito de 15 minutos para identificar qué procesos se pueden automatizar. Luego se entrega una propuesta personalizada con alcance y estimación. Los proyectos se desarrollan en sprints de 2 semanas con entregables parciales, y finaliza con documentación completa."
          }

          "@type": "Question",
